name: Release plugin

run-name: Release ${{ inputs.plugin }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        required: true
        type: choice
        options:
          - fill-extrusion-shadows
      version:
        description: Semantic version, for example 0.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android plugin
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          ./gradlew
          :plugins:${{ inputs.plugin }}:assembleRelease
          -PpluginVersion="$VERSION"
          --stacktrace

      - name: Stage release assets
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-assets
          cp "plugins/$PLUGIN/build/outputs/aar/$PLUGIN-release.aar" "release-assets/$PLUGIN-$VERSION.aar"
          cd release-assets
          sha256sum "$PLUGIN-$VERSION.aar" > "$PLUGIN-$VERSION.aar.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-assets/*

  ios:
    name: Build iOS XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check out plugin-enabled MapLibre Native
        uses: actions/checkout@v4
        with:
          repository: louwers/maplibre-native
          ref: cross-platform-plugin-api
          path: maplibre-native
          submodules: recursive

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Build iOS plugin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          bazel build \
            --@maplibre//:renderer=metal \
            --override_module=maplibre="$GITHUB_WORKSPACE/maplibre-native" \
            --override_module=maplibre-tile-spec="$GITHUB_WORKSPACE/maplibre-native/vendor/maplibre-tile-spec" \
            --embed_label="$VERSION" \
            --define=plugin_version="$VERSION" \
            //plugins/fill-extrusion-shadows:FillExtrusionShadows.xcframework

      - name: Stage release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-assets
          cp \
            bazel-bin/plugins/fill-extrusion-shadows/FillExtrusionShadows.xcframework.xcframework.zip \
            "release-assets/FillExtrusionShadows-$VERSION.xcframework.zip"
          cd release-assets
          shasum -a 256 \
            "FillExtrusionShadows-$VERSION.xcframework.zip" \
            > "FillExtrusionShadows-$VERSION.xcframework.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: release-assets/*

  release:
    name: Publish GitHub release
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$PLUGIN $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" release-assets/* --clobber

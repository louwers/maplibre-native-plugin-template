name: Release plugin

run-name: Release ${{ inputs.plugin }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        required: true
        type: choice
        options:
          - fill-extrusion-shadows
      version:
        description: Semantic version, for example 0.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build and release Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build Android plugin
        env:
          VERSION: ${{ inputs.version }}
        run: >-
          ./gradlew
          :plugins:${{ inputs.plugin }}:assembleRelease
          -PpluginVersion="$VERSION"
          --stacktrace

      - name: Stage release assets
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release-assets
          cp "plugins/$PLUGIN/build/outputs/aar/$PLUGIN-release.aar" "release-assets/$PLUGIN-$VERSION.aar"
          cd release-assets
          sha256sum "$PLUGIN-$VERSION.aar" > "$PLUGIN-$VERSION.aar.sha256"

      - name: Create GitHub release and upload Android artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$PLUGIN $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" release-assets/* --clobber

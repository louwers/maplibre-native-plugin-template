name: Release plugin

run-name: Release ${{ inputs.plugin }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin to release
        required: true
        type: choice
        options:
          - fill-extrusion-shadows
          - gltf-layer
          - rectangle-layer
      version:
        description: Semantic version, for example 0.0.1
        required: true
        type: string

permissions:
  contents: write

jobs:
  android:
    name: Build Android AAR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out plugin-enabled MapLibre Native
        uses: actions/checkout@v4
        with:
          repository: louwers/maplibre-native
          ref: cross-platform-plugin-api
          path: maplibre-native
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Android native toolchain
        run: sdkmanager "ndk;28.2.13676358" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify and publish the C plugin API locally
        run: |
          diff -u \
            maplibre-native/include/mln/plugin/plugin_api.h \
            MapLibrePluginApi/include/mln/plugin/plugin_api.h
          MAPLIBRE_VERSION="0.0.0-plugin-$(git -C maplibre-native rev-parse --short=12 HEAD)-SNAPSHOT"
          echo "MAPLIBRE_VERSION=$MAPLIBRE_VERSION" >> "$GITHUB_ENV"
          maplibre-native/platform/android/gradlew \
            -p maplibre-native/platform/android \
            :android-plugin-api:publishReleasePublicationToMavenLocal \
            -PmaplibreVersion="$MAPLIBRE_VERSION" \
            --stacktrace

      - name: Build Android plugin
        env:
          VERSION: ${{ inputs.version }}
        run: |
          MAPLIBRE_REPOSITORY_URL="file://${HOME}/.m2/repository" \
            ./gradlew \
            :plugins:${{ inputs.plugin }}:assembleRelease \
            -PpluginVersion="$VERSION" \
            -PmaplibreVersion="$MAPLIBRE_VERSION" \
            --stacktrace

      - name: Stage release assets
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          ARTIFACT="$(jq -r .androidArtifact "plugins/$PLUGIN/release.json")"
          mkdir -p release-assets
          cp "plugins/$PLUGIN/build/outputs/aar/$ARTIFACT-release.aar" "release-assets/$ARTIFACT-$VERSION.aar"
          cd release-assets
          sha256sum "$ARTIFACT-$VERSION.aar" > "$ARTIFACT-$VERSION.aar.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release-assets/*

  ios:
    name: Build iOS XCFramework
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check out plugin-enabled MapLibre Native
        uses: actions/checkout@v4
        with:
          repository: louwers/maplibre-native
          ref: cross-platform-plugin-api
          path: maplibre-native
          submodules: recursive

      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: true
          repository-cache: true

      - name: Verify packaged C API header
        run: >-
          diff -u
          maplibre-native/include/mln/plugin/plugin_api.h
          MapLibrePluginApi/include/mln/plugin/plugin_api.h

      - name: Build iOS plugin
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          TARGET="$(jq -r .iosTarget "plugins/$PLUGIN/release.json")"
          bazel build \
            --@maplibre//:renderer=metal \
            --override_module=maplibre="$GITHUB_WORKSPACE/maplibre-native" \
            --override_module=maplibre-tile-spec="$GITHUB_WORKSPACE/maplibre-native/vendor/maplibre-tile-spec" \
            --embed_label="$VERSION" \
            --define=plugin_version="$VERSION" \
            "$TARGET"

      - name: Stage release assets
        env:
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          OUTPUT="$(jq -r .iosBazelOutput "plugins/$PLUGIN/release.json")"
          ASSET="$(jq -r .iosAssetName "plugins/$PLUGIN/release.json")"
          mkdir -p release-assets
          cp "$OUTPUT" "release-assets/$ASSET-$VERSION.xcframework.zip"
          cd release-assets
          shasum -a 256 "$ASSET-$VERSION.xcframework.zip" \
            > "$ASSET-$VERSION.xcframework.zip.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ios-release
          path: release-assets/*

  release:
    name: Publish GitHub release
    needs:
      - android
      - ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: '*-release'
          path: release-assets
          merge-multiple: true

      - name: Create GitHub release and upload artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PLUGIN: ${{ inputs.plugin }}
          VERSION: ${{ inputs.version }}
        run: |
          if ! gh release view "$VERSION" >/dev/null 2>&1; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$PLUGIN $VERSION" --generate-notes
          fi
          gh release upload "$VERSION" release-assets/* --clobber
